name: 🚀 Deploy to Pegaso Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js (Para Next.js)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🛠️ Compilar Booking Engine (Next.js)
      env:
        # Inyectar variables de producción en tiempo de build.
        # Next.js hornea NEXT_PUBLIC_* en el bundle estático —
        # si no se inyectan aquí, el build usará los valores de
        # .env.local (localhost) y se producirá un "localhost leak".
        NEXT_PUBLIC_API_URL: https://pegasoexpediciones.com/api
        NEXT_PUBLIC_PAYPAL_MODE: live
        NEXT_PUBLIC_CONTACT_PHONE: "521XXXXXXXXXX"
      run: |
        cd booking-engine
        npm install
        npm run build
        cd ..
        # Mover la carpeta compilada "out" a "portal" para subirla como subdirectorio
        mv booking-engine/out ./portal

    - name: 📂 Sync files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        # Credenciales SIEMPRE desde GitHub Secrets — Mandamiento #12 (Bóveda de
        # Secretos). Nunca quemar host/usuario/password en este archivo versionado.
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftps
        # ⚠️ ENJAULADO cPanel (causa raíz del error 421 — 2026-06-22):
        # La cuenta FTP de secrets.FTP_USERNAME está enjaulada por cPanel en
        # /home/pegaso/public_html/despliegue. Para un FTP enjaulado, ese
        # directorio jaula ES la raíz "/" que ve la conexión — NO existe un
        # "public_html/" navegable dentro de su propia jaula salvo que sea
        # un symlink. Usar "public_html/" aquí intentaba aterrizar en
        # .../despliegue/public_html/ (inexistente) → 421.
        # server-dir SIEMPRE debe ser "./" mientras se use esta cuenta enjaulada.
        #
        # Si en el futuro se decide subir directo a la raíz real de
        # public_html/ (no a la subcarpeta despliegue/), el cambio NO es
        # aquí: hay que pedirle a cPanel (File Manager → FTP Accounts) una
        # cuenta cuyo "Directory" sea public_html/ directamente. El YAML
        # se queda igual (server-dir: ./) porque el enjaulado siempre
        # expone su propio home como raíz "/".
        server-dir: ./
        # Solo subir: el código PHP en api/, y el frontend compilado en portal/
        # Excluir: código fuente de Next.js, knowledge/, archivos de entorno
        exclude: |
          **/.git*
          **/.git*/**
          **/.github*/**
          README.md
          .gitignore
          .env*
          booking-engine/**
          knowledge/**
